apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-service
  labels:
    app: rsm-hms
    service: clinical-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rsm-hms
      service: clinical-service
  template:
    metadata:
      labels:
        app: rsm-hms
        service: clinical-service
    spec:
      containers:
      - name: clinical-service
        image: rsm-hms-clinical:latest
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: clinical-service-secrets
        - configMapRef:
            name: clinical-service-config
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clinical-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinical-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
